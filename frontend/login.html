<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Nagar e-Connect</title>
  <link rel="stylesheet" href="/css/style.css" />
  <!-- Feather Icons -->
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>

  <div class="auth-container">
    <div class="auth-bg-glow"></div>
    <div class="auth-card">

      <!-- Logo Header -->
      <div class="auth-logo">
        <span class="logo-emoji">🌿</span>
        <div>
          <h1 class="logo-title">Nagar e-Connect</h1>
          <p class="logo-sub">Clean Cities, Smart Citizens</p>
        </div>
      </div>

      <h2 class="auth-heading">Welcome back</h2>
      <p class="auth-subheading">Sign in to your account</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width: 100%;">
          Sign In
        </button>
      </form>

      <!-- Demo Credentials -->
      <div class="demo-credentials">
        <p class="demo-title">🔑 Demo Credentials</p>
        <div class="demo-grid">
          <div class="demo-item">
            <span class="demo-role">Admin</span>
            <span>admin@nagareconnect.in</span>
            <span class="demo-pass">Admin@123</span>
          </div>
        </div>
      </div>

      <p class="switch-text">
        Don't have an account?
        <a href="/register.html">Register here</a>
      </p>
      <p class="switch-text">
        <a href="/">← Back to home</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
