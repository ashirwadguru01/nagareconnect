<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Complaints — Nagar e-Connect</title>
  <link rel="stylesheet" href="/css/style.css" />
  <!-- Feather Icons -->
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar Mount -->
    <div id="sidebar-mount"></div>

    <main class="main-content">
      <!-- Loading Spinner -->
      <div id="loading-spinner" class="spinner-overlay" style="min-height: 80vh;">
        <div class="spinner"></div>
      </div>

      <div id="complaints-content" class="page-wrapper animate-fadeIn" style="display: none;">

        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
          <div>
            <h1 style="font-size: 26px; font-weight: 800;">My Complaints</h1>
            <p id="complaints-count" style="color: var(--text-secondary); font-size: 14px;">0 total complaints</p>
          </div>
          <a href="/citizen/new-complaint.html" class="btn btn-primary">
            <i data-feather="plus"></i> New Report
          </a>
        </div>

        <!-- Filters Bar -->
        <div class="card" style="margin-bottom: 20px; padding: 16px 20px;">
          <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
            <div style="position: relative; flex: 1; min-width: 200px;">
              <input
                type="text"
                id="search-input"
                class="form-input"
                placeholder="Search complaints by title or location..."
              />
            </div>
            <select id="status-filter" class="form-select" style="width: auto; min-width: 150px;">
              <option value="all">All Status</option>
              <option value="pending">Pending</option>
              <option value="in_progress">In Progress</option>
              <option value="resolved">Resolved</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
        </div>

        <!-- Complaints List -->
        <div id="complaints-list" style="display: flex; flex-direction: column; gap: 16px;">
          <!-- Dynamically populated -->
        </div>

      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/my-complaints.js"></script>
</body>
</html>
