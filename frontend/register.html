<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Nagar e-Connect</title>
  <link rel="stylesheet" href="/css/style.css" />
  <!-- Feather Icons -->
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>

  <div class="auth-container">
    <div class="auth-bg-glow"></div>
    <div class="auth-card">

      <!-- Logo Header -->
      <div class="auth-logo">
        <span class="logo-emoji">🌿</span>
        <div>
          <h1 class="logo-title">Nagar e-Connect</h1>
          <p class="logo-sub">Join the Clean India Mission</p>
        </div>
      </div>

      <h2 class="auth-heading">Create Account</h2>
      <p class="auth-subheading">Start reporting issues and earning rewards</p>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input
            class="form-input"
            type="text"
            id="name"
            name="name"
            placeholder="Rahul Sharma"
            required
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input
            class="form-input"
            type="tel"
            id="phone"
            name="phone"
            placeholder="+91 98765 43210"
            autocomplete="tel"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Register As</label>
          <select class="form-select" id="role" name="role">
            <option value="citizen">Citizen</option>
            <option value="worker">Municipal Worker</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="Minimum 6 characters"
            required
            autocomplete="new-password"
          />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width: 100%;">
          Create Account
        </button>
      </form>

      <p class="switch-text">
        Already have an account?
        <a href="/login.html">Sign in</a>
      </p>
      <p class="switch-text">
        <a href="/">← Back to home</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
